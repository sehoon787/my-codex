name: Update Upstream Submodules
on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Specific submodule to update (blank = all)'
        required: false
        default: ''
      dry_run:
        description: 'Update, scan and test only: no push, PR, status or merge'
        required: false
        type: boolean
        default: false

# One sync at a time: a second run waits for the first instead of racing it.
concurrency:
  group: update-upstream
  cancel-in-progress: false

# Read-only unless a job says otherwise. The test job executes upstream code,
# so it runs on its own runner with this token and no secrets; only the
# publish job, which runs no upstream code, can write.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      flagged: ${{ steps.scan.outputs.flagged }}
      branch: ${{ steps.commit.outputs.branch }}
      sha: ${{ steps.commit.outputs.sha }}
      bundle_sha256: ${{ steps.commit.outputs.bundle_sha256 }}
      report_sha256: ${{ steps.commit.outputs.report_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update submodules
        env:
          # Passed through env, never interpolated into the script body: a
          # workflow_dispatch input inlined as ${{ }} is shell-injectable.
          SUBMODULE: ${{ github.event.inputs.submodule }}
        run: |
          if [ -n "$SUBMODULE" ]; then
            git -C "upstream/$SUBMODULE" pull origin HEAD
            git add "upstream/$SUBMODULE"
          else
            # upstream/archify is pinned to a release tag, not a branch: a blanket
            # --remote would drag it to the tip of its default branch. It is bumped
            # deliberately by re-pointing the submodule at a newer tag.
            TAG_PINNED="upstream/archify"
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
              | awk '{print $2}' \
              | while read -r sub_path; do
                  case " $TAG_PINNED " in *" $sub_path "*) continue ;; esac
                  git submodule update --remote "$sub_path"
                done
            git add upstream/
          fi

      # Keep the AI-BOM pins in upstream/SOURCES.json in step with the pointers
      # this PR is bumping, so the manifest never lags the submodules it describes.
      - name: Refresh SOURCES.json pins
        run: |
          # Manifest metadata only. This is the one step in the job that needs
          # node, so it degrades to a warning rather than failing the job and
          # blocking a security-gated submodule update from opening its PR.
          node scripts/refresh-sources-pins.js \
            || echo "::warning::SOURCES.json pin refresh skipped; pins may lag the submodule pointers"
          git add upstream/SOURCES.json

      # The README pin table documents the same pins, so refresh it in the same
      # breath as the manifest — otherwise it goes stale on every sync.
      - name: Refresh README pin table
        run: |
          # Documentation only, and node-only like the step above, so it degrades
          # to a warning rather than blocking the submodule update's PR.
          node scripts/refresh-pin-table.js \
            || echo "::warning::README pin table refresh skipped; the table may lag upstream/SOURCES.json"
          git add README.md docs/i18n/README.*.md

      - name: Check for changes
        id: check
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "## Updated submodules:" >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --name-only >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Security scan of upstream diff
        id: scan
        if: steps.check.outputs.changed == 'true'
        env:
          SCAN_REPORT: scan-report.md
        run: |
          bash scripts/scan-upstream-diff.sh
          cat scan-report.md >> "$GITHUB_STEP_SUMMARY"

      # Commit and rebase before anything is pushed, so the test job runs on
      # exactly the tree the PR would merge.
      - name: Commit and rebase onto main
        id: commit
        if: steps.check.outputs.changed == 'true'
        run: |
          # The run id and attempt keep a second sync on the same day, or a
          # re-run, off this run's branch.
          BRANCH="chore/update-upstream-$(date +%Y%m%d)-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git checkout -b "$BRANCH"
          git commit -m "chore: update upstream submodules $(date +%Y-%m-%d)"
          # Rebase onto latest main to avoid diverged-branch auto-merge failures
          git fetch origin main
          git rebase origin/main
          # The test and publish jobs take this exact commit from a bundle. The
          # sha256 recorded here is how publish knows the artifact is still the
          # one this job made.
          mkdir -p "$RUNNER_TEMP/sync"
          git bundle create "$RUNNER_TEMP/sync/sync.bundle" "origin/main..$BRANCH"
          cp scan-report.md "$RUNNER_TEMP/sync/"
          {
            echo "branch=$BRANCH"
            echo "sha=$(git rev-parse HEAD)"
            echo "bundle_sha256=$(sha256sum "$RUNNER_TEMP/sync/sync.bundle" | cut -d' ' -f1)"
            echo "report_sha256=$(sha256sum "$RUNNER_TEMP/sync/scan-report.md" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the commit and the scan report
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sync
          path: ${{ runner.temp }}/sync/

  # Pushes and PRs made with GITHUB_TOKEN start no workflows, so ci.yml never
  # runs on the sync PR: run its tests here, through the same script. The
  # tests execute upstream code, so this job has the read-only token, no
  # secrets and no stored git credentials, and publish trusts nothing from it
  # but its result.
  test:
    needs: update
    if: needs.update.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.tests.outputs.failed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sync
          path: ${{ runner.temp }}/sync

      - name: Check out the sync commit and its submodules
        env:
          BRANCH: ${{ needs.update.outputs.branch }}
          SHA: ${{ needs.update.outputs.sha }}
        run: |
          git fetch "$RUNNER_TEMP/sync/sync.bundle" "refs/heads/$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SHA"
          git checkout --detach "$SHA"
          git submodule update --init --depth 1

      - name: Run the test suite
        id: tests
        run: bash scripts/run-tests.sh

  publish:
    needs: [update, test]
    # Never on a dry run, and never from a branch other than main. !cancelled()
    # lets it run after the test job failed, to open and flag the PR; sha is
    # set once the commit exists.
    if: ${{ !cancelled() && !inputs.dry_run && github.ref == 'refs/heads/main' && needs.update.outputs.sha != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ needs.update.outputs.branch }}
      SHA: ${{ needs.update.outputs.sha }}
      TESTS: ${{ needs.test.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sync
          path: ${{ runner.temp }}/sync

      # The test job ran upstream code and could have replaced the artifact, so
      # check the bundle and the scan report against the update job's sha256
      # before using either. Then push only that commit, and only if it changes
      # what the update job stages: submodule pointers, SOURCES.json and the
      # README pin tables (scripts/check-sync-commit.sh, from this checkout).
      - name: Verify and push the sync commit
        env:
          BUNDLE_SHA256: ${{ needs.update.outputs.bundle_sha256 }}
          REPORT_SHA256: ${{ needs.update.outputs.report_sha256 }}
        run: |
          printf '%s  %s\n' \
            "$BUNDLE_SHA256" "$RUNNER_TEMP/sync/sync.bundle" \
            "$REPORT_SHA256" "$RUNNER_TEMP/sync/scan-report.md" | sha256sum --check --strict
          git fetch "$RUNNER_TEMP/sync/sync.bundle" "refs/heads/$BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ]; then
            echo "::error::The bundle does not hold the commit the update job made."
            exit 1
          fi
          if ! bash scripts/check-sync-commit.sh origin/main "$SHA"; then
            echo "::error::The sync commit changes more than submodule pointers and pin tables."
            exit 1
          fi
          git push origin "$SHA:refs/heads/$BRANCH"

      # validate is the required check, and ci.yml never runs on this PR: report
      # the test job's result, success only when every test passed.
      - name: Report the test result as the validate status
        run: |
          if [ "$TESTS" = success ]; then
            STATE=success DESCRIPTION="Test suite passed in the upstream sync run"
          else
            STATE=failure DESCRIPTION="Test suite did not pass in the upstream sync run"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" \
            -f context=validate \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL"

      # "Re-run failed jobs" keeps the update job's branch, and with it the PR
      # an earlier attempt opened: reuse that PR instead of failing on a second
      # gh pr create.
      - name: Create or reuse the PR
        id: pr
        run: |
          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --json url,isCrossRepository \
            -q 'map(select(.isCrossRepository | not)) | .[0].url // empty')
          if [ -n "$PR_URL" ]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            PR_URL=$(gh pr create \
              --head "$BRANCH" \
              --title "chore: update upstream submodules $(date +%Y-%m-%d)" \
              --body "Automated upstream submodule update." \
              --base main)
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      # A reused PR may still carry tests-failed from the earlier attempt. Once
      # the tests pass, that label is stale: remove it and say so. Housekeeping
      # only, so a failure here must not skip the merge below.
      - name: Clear a stale tests-failed label
        if: steps.pr.outputs.reused == 'true' && needs.test.result == 'success'
        continue-on-error: true
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if gh pr view "$PR_URL" --json labels -q '.labels[].name' | grep -qx tests-failed; then
            gh pr edit "$PR_URL" --remove-label tests-failed
            gh pr comment "$PR_URL" --body "The test suite passed on a re-run: $RUN_URL"
          fi

      # Clean scan and passing tests → merge automatically, and only the commit
      # that was tested.
      - name: Auto-merge (scan clean, tests passed)
        id: merge
        if: needs.update.outputs.flagged == 'false' && needs.test.result == 'success'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$SHA"

      # Flagged scan → leave PR open, label it, and post the scan report.
      - name: Flag for manual review (scan flagged)
        if: ${{ !cancelled() && steps.pr.outputs.url != '' && needs.update.outputs.flagged == 'true' }}
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh label create needs-review \
            --color FBCA04 \
            --description "Automated change flagged by security scan; needs human review" \
            2>/dev/null || true
          gh pr edit "$PR_URL" --add-label needs-review
          gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/sync/scan-report.md"
          echo "::warning::Upstream sync flagged by security scan — PR left open for manual review."

      # Failed tests → leave PR open, label it, and name the failed step and tests.
      - name: Flag for manual review (tests failed)
        if: ${{ !cancelled() && steps.pr.outputs.url != '' && needs.test.result != 'success' }}
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          FAILED: ${{ needs.test.outputs.failed }}
        run: |
          # FAILED comes from the job that ran upstream code: list only names
          # that look like test paths and exist in this checkout.
          read -r -a reported <<< "$FAILED"
          listed=""
          for t in "${reported[@]}"; do
            if [[ $t =~ ^(tests|scripts)/[A-Za-z0-9._/-]+$ && $t != *..* && -f $t ]]; then
              listed+="- \`$t\`"$'\n'
            fi
          done
          {
            echo ":x: **The test suite did not pass in this sync run** (\`test\` job: $TESTS). Auto-merge was skipped."
            echo ""
            if [ -n "$listed" ]; then
              echo 'Failed step: `Run the test suite` in job `test`. Failed tests:'
              echo ""
              printf '%s' "$listed"
            else
              echo 'No failed test was reported: the `test` job stopped before or outside `Run the test suite`.'
            fi
            echo ""
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/tests-comment.md"
          gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/tests-comment.md"
          gh label create tests-failed \
            --color D93F0B \
            --description "Automated upstream sync whose test suite failed; needs a fix" \
            2>/dev/null || true
          gh pr edit "$PR_URL" --add-label tests-failed
          echo "::warning::Upstream sync tests failed — PR left open for manual review."

      # Merge refused (main moved during the test run, or the PR head is not the
      # tested commit) → leave PR open, label it, and say why it is still open.
      - name: Flag for manual review (auto-merge failed)
        if: ${{ !cancelled() && steps.merge.outcome == 'failure' }}
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo ":warning: **Auto-merge failed.** The scan was clean and the tests passed on \`$SHA\`, but the merge was refused, for example because main moved during the test run."
            echo ""
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/merge-comment.md"
          gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/merge-comment.md"
          gh label create auto-merge-failed \
            --color D93F0B \
            --description "Automated upstream sync whose auto-merge was refused; needs a rebase or a manual merge" \
            2>/dev/null || true
          gh pr edit "$PR_URL" --add-label auto-merge-failed
          echo "::warning::Upstream sync auto-merge failed — PR left open for manual review."
