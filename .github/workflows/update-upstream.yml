name: Update Upstream Submodules
on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Specific submodule to update (blank = all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update submodules
        env:
          # Passed through env, never interpolated into the script body: a
          # workflow_dispatch input inlined as ${{ }} is shell-injectable.
          SUBMODULE: ${{ github.event.inputs.submodule }}
        run: |
          if [ -n "$SUBMODULE" ]; then
            git -C "upstream/$SUBMODULE" pull origin HEAD
            git add "upstream/$SUBMODULE"
          else
            # upstream/archify is pinned to a release tag, not a branch: a blanket
            # --remote would drag it to the tip of its default branch. It is bumped
            # deliberately by re-pointing the submodule at a newer tag.
            TAG_PINNED="upstream/archify"
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
              | awk '{print $2}' \
              | while read -r sub_path; do
                  case " $TAG_PINNED " in *" $sub_path "*) continue ;; esac
                  git submodule update --remote "$sub_path"
                done
            git add upstream/
          fi

      # Keep the AI-BOM pins in upstream/SOURCES.json in step with the pointers
      # this PR is bumping, so the manifest never lags the submodules it describes.
      - name: Refresh SOURCES.json pins
        run: |
          # Manifest metadata only. This is the one step in the job that needs
          # node, so it degrades to a warning rather than failing the job and
          # blocking a security-gated submodule update from opening its PR.
          node scripts/refresh-sources-pins.js \
            || echo "::warning::SOURCES.json pin refresh skipped; pins may lag the submodule pointers"
          git add upstream/SOURCES.json

      # The README pin table documents the same pins, so refresh it in the same
      # breath as the manifest — otherwise it goes stale on every sync.
      - name: Refresh README pin table
        run: |
          # Documentation only, and node-only like the step above, so it degrades
          # to a warning rather than blocking the submodule update's PR.
          node scripts/refresh-pin-table.js \
            || echo "::warning::README pin table refresh skipped; the table may lag upstream/SOURCES.json"
          git add README.md docs/i18n/README.*.md

      - name: Check for changes
        id: check
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "## Updated submodules:" >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --name-only >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Security scan of upstream diff
        id: scan
        if: steps.check.outputs.changed == 'true'
        env:
          SCAN_REPORT: scan-report.md
        run: |
          bash scripts/scan-upstream-diff.sh
          cat scan-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create PR
        id: pr
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git commit -m "chore: update upstream submodules $(date +%Y-%m-%d)"
          git push origin "$BRANCH"
          # Rebase onto latest main to avoid diverged-branch auto-merge failures
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin "$BRANCH"
          SHA=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state=success \
            -f context=validate \
            -f description="Submodule pointer update"
          PR_URL=$(gh pr create \
            --title "chore: update upstream submodules $(date +%Y-%m-%d)" \
            --body "Automated upstream submodule update." \
            --base main)
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      # Clean scan → merge automatically, as before.
      - name: Auto-merge (scan clean)
        if: steps.check.outputs.changed == 'true' && steps.scan.outputs.flagged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch

      # Flagged scan → leave PR open, label it, and post the scan report.
      - name: Flag for manual review (scan flagged)
        if: steps.check.outputs.changed == 'true' && steps.scan.outputs.flagged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create needs-review \
            --color FBCA04 \
            --description "Automated change flagged by security scan; needs human review" \
            2>/dev/null || true
          gh pr edit "${{ steps.pr.outputs.url }}" --add-label needs-review
          gh pr comment "${{ steps.pr.outputs.url }}" --body-file scan-report.md
          echo "::warning::Upstream sync flagged by security scan — PR left open for manual review."
